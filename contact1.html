<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Contact</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <span class="nav-label">Navigation:</span>
            <nav class="main-nav">
                <a href="home.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About Me</a>
                <a href="contact1.html" class="nav-link active">Contact Me</a>
            </nav>
        </div>
    </header>

    <main class="content-wrapper">
        <section class="form-card">
            <h1 class="page-title">Contact Me</h1>
            <p class="form-intro">Have a question or want to collaborate? Fill out the form below to get in touch!</p>
            
            <form action="#" method="POST" class="responsive-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Zyann Kyle Condino" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject">
                        <option value="general">General Inquiry</option>
                        <option value="project">Project Collaboration</option>
                        <option value="feedback">Website Feedback</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6" placeholder="Type your message here..." required></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-submit">Send Message</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Student Profile Project. All rights reserved.</p>
    </footer>

</body>
</html>
