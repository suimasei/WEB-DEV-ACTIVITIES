<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <table border="0" width="100%" cellpadding="0" cellspacing="0">
            <tr>
                <td align="right">
                    <nav>
                        <strong>Navigation:</strong>
                        <a href="index.html">Home/Bio</a> | 
                        <a href="contact.html">Contact Me</a>
                    </nav>
                </td>
            </tr>
        </table>
        <hr>
        <center><h1>Contact Me</h1></center>
    </header>

    <main>
        <center>
            <p>Have a question or want to collaborate? Fill out the form below to get in touch!</p>
            
            <form action="#" method="POST">
                <table border="0" cellpadding="5" cellspacing="0">
                    <tr>
                        <td align="right"><label for="name"><strong>Full Name:</strong></label></td>
                        <td align="left"><input type="text" id="name" name="name" placeholder="Zyann Kyle Condino" size="30" required></td>
                    </tr>
                    <tr>
                        <td align="right"><label for="email"><strong>Email Address:</strong></label></td>
                        <td align="left"><input type="email" id="email" name="email" placeholder="example@email.com" size="30" required></td>
                    </tr>
                    <tr>
                        <td align="right"><label for="subject"><strong>Subject:</strong></label></td>
                        <td align="left">
                            <select id="subject" name="subject" style="width: 100%;">
                                <option value="general">General Inquiry</option>
                                <option value="project">Project Collaboration</option>
                                <option value="feedback">Website Feedback</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td align="right" valign="top"><label for="message"><strong>Message:</strong></label></td>
                        <td align="left"><textarea id="message" name="message" rows="5" cols="32" placeholder="Type your message here..." required></textarea></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td align="left">
                            <br>
                            <button type="submit" style="padding: 5px 15px;">Send Message</button>
                        </td>
                    </tr>
                </table>
            </form>
        </center>
    </main>

    <hr>
    <footer>
        <center>
            <p>&copy; 2026 Student Profile Project. All rights reserved.</p>
        </center>
    </footer>

</body>
</html>
