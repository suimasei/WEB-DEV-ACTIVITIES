<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>

    <div class="calculator">
        <div class="calculator-screen-wrapper">
            <div id="operator-indicator" class="operator-display"></div>
            <div id="screen" class="calculator-screen">0</div>
        </div>
        
        <div class="calculator-keys">
            <button class="btn special-btn" onclick="clearScreen()">C</button>
            <button class="btn special-btn" onclick="deleteLast()">DEL</button>
            <button class="btn special-btn" onclick="appendNumber('.')">.</button>
            <button class="btn op-btn" onclick="setOperator('/')">/</button>
            
            <button class="btn" onclick="appendNumber('7')">7</button>
            <button class="btn" onclick="appendNumber('8')">8</button>
            <button class="btn" onclick="appendNumber('9')">9</button>
            <button class="btn op-btn" onclick="setOperator('*')">x</button>
            
            <button class="btn" onclick="appendNumber('4')">4</button>
            <button class="btn" onclick="appendNumber('5')">5</button>
            <button class="btn" onclick="appendNumber('6')">6</button>
            <button class="btn op-btn" onclick="setOperator('-')">-</button>
            
            <button class="btn" onclick="appendNumber('1')">1</button>
            <button class="btn" onclick="appendNumber('2')">2</button>
            <button class="btn" onclick="appendNumber('3')">3</button>
            <button class="btn op-btn" onclick="setOperator('+')">+</button>
            
            <button class="btn" onclick="appendNumber('0')">0</button>
            <button class="btn equal-btn" onclick="calculate()">=</button>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
